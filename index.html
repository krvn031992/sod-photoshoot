<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOD Recital 2026 – Official Photoshoot</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#150820;font-family:'Cormorant Garamond',Georgia,serif;color:#fff0dc;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,#deb060 0,transparent 1px,transparent 40px),repeating-linear-gradient(90deg,#deb060 0,transparent 1px,transparent 40px);opacity:.025;pointer-events:none;z-index:0}
  body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(88,0,120,.35) 0%,transparent 65%);pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:32px 16px 48px}
  .admin-wrap{max-width:800px}
  /* Gold divider */
  .divider{display:flex;align-items:center;gap:12}
  .divider::before,.divider::after{content:'';flex:1;height:1px}
  .divider::before{background:linear-gradient(to right,transparent,#deb060)}
  .divider::after{background:linear-gradient(to left,transparent,#deb060)}
  .divider-diamond{width:7px;height:7px;background:#deb060;transform:rotate(45deg);flex-shrink:0}
  /* Corner borders */
  .corner-box{position:relative;padding:28px 20px 24px}
  .corner-box::before,.corner-box::after{content:'';position:absolute;width:22px;height:22px;border-color:#deb060;border-style:solid}
  .corner-box::before{top:10px;left:10px;border-width:2px 0 0 2px}
  .corner-box::after{top:10px;right:10px;border-width:2px 2px 0 0}
  .corner-box .cb-bl,.corner-box .cb-br{content:'';position:absolute;width:22px;height:22px;border-color:#deb060;border-style:solid}
  .corner-box .cb-bl{bottom:10px;left:10px;border-width:0 0 2px 2px}
  .corner-box .cb-br{bottom:10px;right:10px;border-width:0 2px 2px 0}
  /* Cards */
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(222,176,96,.2);border-radius:12px;padding:22px 20px;margin-bottom:20px}
  .card-label{font-size:10px;letter-spacing:.2em;color:#deb060;text-transform:uppercase;margin-bottom:4px}
  .card-title{font-size:21px;font-weight:700;margin-bottom:18px}
  /* Inputs */
  input,select,textarea{background:rgba(255,240,220,.05);border:1px solid rgba(222,176,96,.25);border-radius:8px;padding:11px 14px;color:#fff0dc;font-size:15px;font-family:inherit;width:100%;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:rgba(222,176,96,.55);box-shadow:0 0 0 2px rgba(222,176,96,.07)}
  input::placeholder,textarea::placeholder{color:rgba(255,240,220,.22)}
  select option{background:#270934;color:#fff0dc}
  label{display:block;color:rgba(222,176,96,.8);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .field{margin-bottom:16px}
  .err{color:#f08080;font-size:12px;margin-top:5px}
  /* Buttons */
  .btn-gold{background:linear-gradient(135deg,#deb060,#c49040);border:none;border-radius:8px;color:#150820;font-size:14px;font-family:inherit;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:15px 24px;width:100%;margin-top:8px;transition:opacity .2s}
  .btn-gold:hover{opacity:.9}
  .btn-gold:disabled{background:rgba(222,176,96,.35);cursor:default}
  .btn-outline{background:transparent;border:1px solid rgba(222,176,96,.35);border-radius:8px;color:#deb060;font-size:13px;font-family:inherit;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:13px 28px}
  .btn-sm{padding:7px 12px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;border:1px solid rgba(222,176,96,.25);background:transparent;color:#deb060}
  .btn-del{border-color:rgba(255,80,80,.25);color:rgba(255,80,80,.5)}
  /* Payment method buttons */
  .pay-btn{padding:10px 24px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;background:transparent;border:1px solid rgba(222,176,96,.2);color:rgba(255,240,220,.5);transition:all .15s;margin-right:10px;margin-bottom:10px}
  .pay-btn.active{background:rgba(222,176,96,.15);border-color:#deb060;color:#deb060}
  /* Status badges */
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .badge-pending{background:rgba(222,176,96,.12);color:#deb060;border:1px solid rgba(222,176,96,.4)}
  .badge-paid{background:rgba(78,203,130,.10);color:#4ecb82;border:1px solid rgba(78,203,130,.4)}
  .badge-confirmed{background:rgba(115,87,255,.12);color:#b48ff0;border:1px solid rgba(115,87,255,.4)}
  /* Status toggle buttons */
  .status-btn{flex:1;padding:7px 4px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;border:1px solid rgba(222,176,96,.15);background:transparent;color:rgba(255,240,220,.32);transition:all .15s}
  .status-btn.active-pending{background:rgba(222,176,96,.12);color:#deb060;border-color:rgba(222,176,96,.4)}
  .status-btn.active-paid{background:rgba(78,203,130,.10);color:#4ecb82;border-color:rgba(78,203,130,.4)}
  .status-btn.active-confirmed{background:rgba(115,87,255,.12);color:#b48ff0;border-color:rgba(115,87,255,.4)}
  /* Upload zone */
  .upload-zone{border:2px dashed rgba(222,176,96,.3);border-radius:10px;padding:28px 20px;text-align:center;cursor:pointer;background:rgba(222,176,96,.04);transition:border-color .2s}
  .upload-zone:hover,.upload-zone.drag{border-color:rgba(222,176,96,.6)}
  .upload-zone.error{border-color:#f08080}
  /* Screenshot preview */
  .screenshot-wrap{position:relative}
  .screenshot-wrap img{width:100%;max-height:300px;object-fit:contain;border-radius:10px;border:1px solid rgba(78,203,130,.4);background:rgba(0,0,0,.3)}
  .screenshot-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px}
  .screenshot-actions button{padding:6px 12px;background:rgba(21,8,32,.88);border:1px solid rgba(222,176,96,.4);border-radius:6px;color:#deb060;font-size:12px;font-family:inherit;cursor:pointer}
  .screenshot-actions .btn-x{border-color:rgba(255,80,80,.3);color:rgba(255,80,80,.7)}
  /* Entry cards */
  .entry-card{background:rgba(255,255,255,.03);border:1px solid rgba(222,176,96,.12);border-radius:10px;overflow:hidden;margin-bottom:10px}
  .entry-inner{padding:16px}
  .entry-actions{display:flex;gap:5px;padding-top:10px;border-top:1px solid rgba(222,176,96,.08);flex-wrap:wrap}
  .screenshot-expand{width:100%;padding:8px;border:1px solid rgba(222,176,96,.2);border-radius:7px;background:rgba(222,176,96,.06);color:#deb060;font-size:12px;font-family:inherit;cursor:pointer;letter-spacing:.06em;margin-bottom:10px}
  .screenshot-full{border-top:1px solid rgba(222,176,96,.1);padding:12px 16px;background:rgba(0,0,0,.2);display:none}
  .screenshot-full img{width:100%;max-height:420px;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.3)}
  /* Summary stats */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(222,176,96,.15);border-radius:10px;padding:12px 14px}
  /* Admin tab buttons */
  .tab-bar{display:flex;gap:4px;background:rgba(255,255,255,.04);border-radius:10px;padding:4px;margin-bottom:20px}
  .tab-btn{flex:1;padding:11px 8px;border:none;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;background:transparent;color:rgba(255,240,220,.45);transition:all .2s}
  .tab-btn.active{background:linear-gradient(135deg,#deb060,#c49040);color:#150820;font-weight:700}
  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(8,3,14,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;display:none}
  .modal-overlay.open{display:flex}
  .modal-box{background:#1d0c2c;border:1px solid rgba(222,176,96,.35);border-radius:14px;padding:24px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto}
  /* Schedule */
  .schedule-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(222,176,96,.1)}
  .schedule-row:last-child{border-bottom:none}
  /* Account details card */
  .account-card{width:100%;background:rgba(222,176,96,.06);border:1px solid rgba(222,176,96,.2);border-radius:10px;padding:14px 18px}
  .account-row{display:flex;justify-content:space-between;padding:5px 0}
  .account-note{font-size:12px;color:rgba(255,240,220,.38);border-top:1px solid rgba(222,176,96,.12);padding-top:10px;margin-top:8px}
  /* QR card */
  .qr-card{background:white;border-radius:12px;padding:14px;width:100%;max-width:340px}
  .qr-card img{width:100%;height:auto;display:block;border-radius:4px}
  /* Classes list */
  .class-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(222,176,96,.12);border-radius:8px;padding:10px 14px;margin-bottom:6px}
  /* Edit form */
  .edit-form{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .edit-actions{display:flex;gap:8px}
  /* Utility */
  .hidden{display:none!important}
  .text-gold{color:#deb060}
  .text-muted{color:rgba(255,240,220,.4)}
  .text-dim{color:rgba(255,240,220,.28)}
  .text-green{color:#4ecb82}
  .text-red{color:rgba(255,80,80,.5)}
  .mt-4{margin-top:4px}
  .mt-8{margin-top:8px}
  .mt-10{margin-top:10px}
  .mt-20{margin-top:20px}
  .mb-0{margin-bottom:0}
  @media(max-width:520px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<!-- Export Modal -->
<div class="modal-overlay" id="exportModal">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div>
        <p style="font-size:20px;font-weight:700;color:#deb060;margin:0">Export Data</p>
        <p id="exportCount" style="font-size:13px;color:rgba(255,240,220,.5);margin:4px 0 0"></p>
      </div>
      <button onclick="closeModal('exportModal')" style="background:transparent;border:none;color:rgba(255,240,220,.5);font-size:22px;cursor:pointer;font-family:inherit;line-height:1">✕</button>
    </div>
    <p style="font-size:13px;color:rgba(255,240,220,.55);line-height:1.6;margin:8px 0 16px">A download may have started. If nothing downloaded, copy the data below and paste into Excel or Google Sheets.</p>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button onclick="copyCSV()" id="copyBtn" style="flex:1;min-width:140px;padding:12px;background:linear-gradient(135deg,#deb060,#c49040);border:none;border-radius:8px;color:#150820;font-weight:700;font-family:inherit;font-size:14px;cursor:pointer">Copy to Clipboard</button>
      <button onclick="openCSVTab()" style="flex:1;min-width:140px;padding:12px;background:transparent;border:1px solid rgba(222,176,96,.4);border-radius:8px;color:#deb060;font-weight:600;font-family:inherit;font-size:14px;cursor:pointer">Open in New Tab</button>
    </div>
    <textarea id="csvTextarea" readonly onfocus="this.select()" style="width:100%;height:200px;background:rgba(0,0,0,.35);border:1px solid rgba(222,176,96,.2);border-radius:8px;color:rgba(255,240,220,.8);font-family:monospace;font-size:12px;padding:12px;outline:none;resize:vertical;box-sizing:border-box"></textarea>
    <p style="font-size:12px;color:rgba(255,240,220,.35);margin:10px 0 0;line-height:1.5">Tip: In Google Sheets, paste then Data → Split text to columns. In Excel, paste then Data → Text to Columns.</p>
  </div>
</div>

// ── State ──────────────────────────────────────────────────
let mode = 'parent'; // parent | adminPin | admin
let payments = [];
let classes = JSON.parse(JSON.stringify(DEFAULT_CLASSES));
let form = { studentName:'', parentName:'', branch:'Manila / Binondo', className:'', contact:'', paymentMethod:'gcash', screenshotData:null, screenshotName:'' };
let errors = {};
let submitting = false;
let done = false;
let submitted = null;
let tapCount = 0; let tapTimer = null;
let adminTab = 'payments';
let filterStatus = 'All'; let filterBranch = 'All'; let search = '';
let expandedIds = new Set();
let editingId = null; let editForm = {};
let newClassBranch = 'Manila / Binondo'; let newClassName = '';
let csvText = '';

// ── Storage ────────────────────────────────────────────────
function storageGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.warn('Storage full', e); }
}

function loadAll() {
  const p = storageGet(STORAGE_KEY); if (p) payments = p;
  const c = storageGet(CLASSES_KEY); if (c) classes = c;
  // set initial class
  const list = classes[form.branch] || [];
  if (list.length && !list.includes(form.className)) form.className = list[0];
}

// ── Render ─────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.className = 'wrap' + (mode === 'admin' ? ' admin-wrap' : '');
  if (mode === 'parent') app.innerHTML = renderParent();
  else if (mode === 'adminPin') app.innerHTML = renderAdminPin();
  else app.innerHTML = renderAdmin();
  bindEvents();
}

// ── Header ─────────────────────────────────────────────────
function renderHeader(small=false) {
  const tap = `onclick="handleTitleTap()"`;
  if (small) return `
    <div style="text-align:center;margin-bottom:20px">
      <p ${tap} style="font-size:10px;letter-spacing:.3em;color:#deb060;text-transform:uppercase;cursor:default;user-select:none">STATE OF DANCE · RECITAL 2026</p>
    </div>`;
  return `
    <div class="corner-box" style="text-align:center;margin-bottom:32px">
      <span class="cb-bl"></span><span class="cb-br"></span>
      <p ${tap} style="font-size:10px;letter-spacing:.3em;color:#deb060;margin:0 0 14px;text-transform:uppercase;cursor:default;user-select:none">STATE OF DANCE · RECITAL 2026</p>
      <h1 style="font-size:clamp(46px,11vw,68px);font-weight:900;margin:0 0 2px;line-height:.9;color:#fff0dc">OFFICIAL</h1>
      <h1 style="font-size:clamp(46px,11vw,68px);font-weight:900;margin:0 0 16px;line-height:.9;font-style:italic;color:#deb060">PHOTOSHOOT</h1>
      <div class="divider"><span class="divider-diamond"></span></div>
      <p style="margin-top:16px;font-size:18px;font-style:italic;color:rgba(255,240,220,.7)">Your recital, on record.</p>
      <div style="margin-top:20px;display:inline-block;background:rgba(88,0,120,.35);border:1px solid rgba(222,176,96,.4);border-radius:10px;padding:12px 28px">
        <p style="font-size:10px;letter-spacing:.2em;color:rgba(222,176,96,.7);margin:0 0 4px;text-transform:uppercase">Per Student</p>
        <p style="font-size:44px;font-weight:900;color:#deb060;margin:0;line-height:1">₱750</p>
        <p style="font-size:13px;color:rgba(255,240,220,.6);margin:4px 0 0;letter-spacing:.08em">1 Solo Shot + 1 Group Shot</p>
      </div>
    </div>`;
}

// ── Parent ─────────────────────────────────────────────────
function renderParent() {
  if (done) return renderSuccess();
  const bank = BANK[form.paymentMethod];
  const classList = classes[form.branch] || [];
  const errField = (k) => errors[k] ? `<p class="err">${errors[k]}</p>` : '';
  const borderErr = (k) => errors[k] ? '#f08080' : 'rgba(222,176,96,.25)';

  const scheduleRows = BRANCHES.map(b => `
    <div class="schedule-row">
      <p style="font-weight:700;font-size:17px;margin:0">${b.name}</p>
      <p style="font-size:15px;color:#deb060;font-weight:700;margin:0">${b.dates}</p>
    </div>`).join('');

  const payBtns = ['gcash','bdo','bpi'].map(id =>
    `<button class="pay-btn ${form.paymentMethod===id?'active':''}" onclick="selectPayment('${id}')">${BANK[id].name}</button>`
  ).join('');

  const accountRows = bank.rows.map(r => `
    <div class="account-row">
      <span style="font-size:12px;color:rgba(255,240,220,.45);text-transform:uppercase;letter-spacing:.1em">${r.l}</span>
      <span style="font-size:15px;font-weight:700;color:#deb060">${r.v}</span>
    </div>`).join('');

  const branchOpts = BRANCHES.map(b => `<option value="${b.name}" ${form.branch===b.name?'selected':''}>${b.name}</option>`).join('');
  const classOpts = classList.map(c => `<option value="${escHtml(c)}" ${form.className===c?'selected':''}>${escHtml(c)}</option>`).join('');

  const screenshotHtml = form.screenshotData ? `
    <div class="screenshot-wrap">
      <img src="${form.screenshotData}" alt="Payment screenshot">
      <div class="screenshot-actions">
        <button onclick="document.getElementById('fileInput').click()">Change</button>
        <button class="btn-x" onclick="clearScreenshot()">✕</button>
      </div>
    </div>
    <p class="mt-8 text-green" style="font-size:12px">✓ ${escHtml(form.screenshotName||'Screenshot uploaded')}</p>
  ` : `
    <div class="upload-zone ${errors.screenshot?'error':''}" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <p style="font-size:28px;margin:0 0 8px;color:rgba(222,176,96,.45)">↑</p>
      <p style="font-size:15px;color:rgba(255,240,220,.6);margin:0 0 4px">Tap to upload your payment screenshot</p>
      <p style="font-size:12px;color:rgba(255,240,220,.3);margin:0">Screenshot from GCash, BDO, or BPI app</p>
    </div>`;

  return `
    ${renderHeader()}
    <div class="card" style="padding:18px 20px 10px;margin-bottom:24px">
      <p style="font-size:10px;letter-spacing:.22em;color:#deb060;margin-bottom:14px;text-transform:uppercase;text-align:center">Photoshoot Schedule</p>
      ${scheduleRows}
      <p style="font-size:12px;color:rgba(255,240,220,.4);text-align:center;margin-top:10px;margin-bottom:2px">30 min before your class time · Each class brings their own theme & concept</p>
    </div>
    <div class="card">
      <p class="card-label">Step 1</p>
      <p class="card-title">Choose Payment Method</p>
      <div>${payBtns}</div>
    </div>
    <div class="card">
      <p class="card-label">Step 2</p>
      <p class="card-title">Send ₱750 via ${bank.name}</p>
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
        <div class="qr-card">
          <img src="data:image/${bank.mime};base64,${bank.img}" alt="${bank.name} QR">
        </div>
        <div class="account-card">
          ${accountRows}
          <p class="account-note">${bank.note}</p>
        </div>
      </div>
    </div>
    <div class="card">
      <p class="card-label">Step 3</p>
      <p class="card-title">Fill in Your Details</p>
      <div class="field">
        <label>Student Name *</label>
        <input id="f-studentName" style="border-color:${borderErr('studentName')}" placeholder="Full name of the student" value="${escHtml(form.studentName)}" oninput="form.studentName=this.value">
        ${errField('studentName')}
      </div>
      <div class="field">
        <label>Parent / Guardian Name *</label>
        <input id="f-parentName" style="border-color:${borderErr('parentName')}" placeholder="Your full name" value="${escHtml(form.parentName)}" oninput="form.parentName=this.value">
        ${errField('parentName')}
      </div>
      <div class="field">
        <label>Branch</label>
        <select onchange="selectBranch(this.value)">${branchOpts}</select>
      </div>
      <div class="field">
        <label>Class *</label>
        <select id="f-className" style="border-color:${borderErr('className')}" onchange="form.className=this.value">
          ${classList.length===0?'<option value="">No classes available</option>':classOpts}
        </select>
        ${errField('className')}
      </div>
      <div class="field">
        <label>Contact Number *</label>
        <input id="f-contact" style="border-color:${borderErr('contact')}" placeholder="09XX XXX XXXX" value="${escHtml(form.contact)}" oninput="form.contact=this.value">
        ${errField('contact')}
      </div>
      <div class="field">
        <label>Payment Screenshot *</label>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
        ${screenshotHtml}
        ${errors.screenshot?`<p class="err">${errors.screenshot}</p>`:''}
      </div>
      <button class="btn-gold" id="submitBtn" onclick="submitForm()" ${submitting?'disabled':''}>
        ${submitting?'Submitting…':'Submit Registration'}
      </button>
    </div>
    <p style="text-align:center;margin-top:28px;font-size:13px;color:rgba(255,240,220,.3)">Questions? Ask your teacher or branch admin.</p>`;
}

function renderAdminPin() {
  return `
    ${renderHeader(true)}
    <div style="max-width:300px;margin:30px auto 0;text-align:center">
      <p style="font-size:20px;font-weight:700;margin:0 0 8px">Admin Access</p>
      <p style="font-size:14px;color:rgba(255,240,220,.4);margin:0 0 24px">Enter PIN to continue</p>
      <input type="password" id="pinInput" style="text-align:center;font-size:22px;letter-spacing:.25em;margin-bottom:8px;padding:12px" placeholder="· · · ·" maxlength="6" onkeydown="if(event.key==='Enter')tryUnlock()">
      <p id="pinErr" style="color:#f08080;font-size:13px;margin-bottom:8px;display:none">Incorrect PIN</p>
      <button class="btn-gold" style="margin-top:4px" onclick="tryUnlock()">Unlock</button>
      <button onclick="setMode('parent')" style="margin-top:14px;background:transparent;border:none;color:rgba(255,240,220,.35);font-size:13px;font-family:inherit;cursor:pointer;display:block;width:100%">← Back to registration</button>
    </div>`;
}

// ── Admin ──────────────────────────────────────────────────
function renderAdmin() {
  return `
    <div style="text-align:center;margin-bottom:24px">
      <p style="font-size:10px;letter-spacing:.3em;color:#deb060;margin:0 0 8px;text-transform:uppercase">STATE OF DANCE · ADMIN</p>
      <h1 style="font-size:32px;font-weight:900;margin:0">Admin Dashboard</h1>
    </div>
    <div class="tab-bar">
      <button class="tab-btn ${adminTab==='payments'?'active':''}" onclick="switchAdminTab('payments')">Payments</button>
      <button class="tab-btn ${adminTab==='classes'?'active':''}" onclick="switchAdminTab('classes')">Manage Classes</button>
    </div>
    ${adminTab==='payments'?renderPayments():renderClasses()}
    <button onclick="setMode('parent')" style="margin-top:20px;padding:10px 20px;background:transparent;border:1px solid rgba(222,176,96,.18);border-radius:8px;color:rgba(255,240,220,.3);font-size:12px;font-family:inherit;cursor:pointer">Exit Admin</button>`;
}

function renderPayments() {
  const filtered = getFiltered();
  const summary = {
    total: payments.length,
    paid: payments.filter(p=>p.status==='Paid'||p.status==='Confirmed').length,
    pending: payments.filter(p=>p.status==='Pending').length,
    revenue: payments.filter(p=>p.status==='Paid'||p.status==='Confirmed').length*750,
  };
  const stats = [['Registered',summary.total,'#deb060'],['Paid/Conf.',summary.paid,'#4ecb82'],['Pending',summary.pending,'#f0a830'],['Revenue','₱'+summary.revenue.toLocaleString(),'#b48ff0']];
  const branchOpts = ['All',...BRANCHES.map(b=>b.name)].map(b=>`<option value="${b}" ${filterBranch===b?'selected':''}>${b}</option>`).join('');
  const statusOpts = ['All','Pending','Paid','Confirmed'].map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${s}</option>`).join('');

  const entries = filtered.length===0
    ? `<div style="text-align:center;padding:48px 0;color:rgba(255,240,220,.28)"><p style="font-size:34px;margin:0 0 8px">—</p><p style="font-size:14px">${payments.length===0?'No registrations yet.':'No results match.'}</p></div>`
    : filtered.map(renderEntry).join('');

  return `
    <div class="stats-grid">${stats.map(([l,v,c])=>`<div class="stat-card"><p style="font-size:9px;letter-spacing:.08em;color:rgba(255,240,220,.38);margin:0 0 4px;text-transform:uppercase">${l}</p><p style="font-size:22px;font-weight:700;color:${c};margin:0">${v}</p></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <input style="flex:1;min-width:140px;font-size:14px" placeholder="Search name, class, contact…" value="${escHtml(search)}" oninput="search=this.value;renderAdmin_()">
      <select style="width:auto;font-size:14px" onchange="filterBranch=this.value;renderAdmin_()">${branchOpts}</select>
      <select style="width:auto;font-size:14px" onchange="filterStatus=this.value;renderAdmin_()">${statusOpts}</select>
      <button onclick="doExport()" style="padding:11px 18px;background:linear-gradient(135deg,#deb060,#c49040);border:none;border-radius:8px;color:#150820;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap">Export CSV</button>
      <button onclick="loadAll();renderAdmin_()" style="padding:11px 14px;background:transparent;border:1px solid rgba(222,176,96,.3);border-radius:8px;color:#deb060;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap">↻ Refresh</button>
    </div>
    <div id="entries-list">${entries}</div>`;
}

function renderEntry(p) {
  const sc = {Pending:'pending',Paid:'paid',Confirmed:'confirmed'}[p.status]||'pending';
  const isExp = expandedIds.has(p.id);
  const isEdit = editingId===p.id;
  const branchOpts = BRANCHES.map(b=>`<option value="${b.name}" ${(editForm.branch||p.branch)===b.name?'selected':''}>${b.name}</option>`).join('');

  const editHtml = `
    <div class="edit-form">
      <input placeholder="Student name" value="${escHtml(editForm.studentName)}" oninput="editForm.studentName=this.value">
      <input placeholder="Parent name" value="${escHtml(editForm.parentName)}" oninput="editForm.parentName=this.value">
      <input placeholder="Contact" value="${escHtml(editForm.contact)}" oninput="editForm.contact=this.value">
      <input placeholder="Class" value="${escHtml(editForm.className)}" oninput="editForm.className=this.value">
      <select onchange="editForm.branch=this.value">${branchOpts}</select>
      <div class="edit-actions">
        <button onclick="saveEdit('${p.id}')" style="flex:1;padding:9px;background:linear-gradient(135deg,#deb060,#c49040);border:none;border-radius:7px;color:#150820;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer">Save</button>
        <button onclick="cancelEdit()" style="flex:1;padding:9px;background:transparent;border:1px solid rgba(222,176,96,.3);border-radius:7px;color:rgba(255,240,220,.5);font-family:inherit;font-size:13px;cursor:pointer">Cancel</button>
      </div>
    </div>`;

  const infoHtml = `
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:10px">
      <div style="flex:1;min-width:0">
        <p style="font-weight:700;font-size:17px;margin:0 0 3px">${escHtml(p.studentName)}</p>
        <p style="font-size:13px;color:rgba(255,240,220,.45);margin:0">Parent: ${escHtml(p.parentName)} · ${escHtml(p.contact)}</p>
        <p style="font-size:12px;color:rgba(222,176,96,.65);margin:4px 0 2px;line-height:1.5">${escHtml(p.className)}</p>
        <p style="font-size:11px;color:rgba(255,240,220,.28);margin:0">${escHtml(p.branch)} · via ${(p.paymentMethod||'').toUpperCase()} · ${escHtml(p.submittedAt)}</p>
      </div>
      <div style="flex-shrink:0;text-align:right">
        <span class="badge badge-${sc}">${p.status}</span>
        <p style="font-size:16px;font-weight:700;color:#deb060;margin:7px 0 0">₱750</p>
      </div>
    </div>
    ${p.screenshotData
      ? `<button class="screenshot-expand" onclick="toggleExpand('${p.id}')">${isExp?'▲ Hide Screenshot':'▼ View Payment Screenshot'}</button>`
      : `<p class="text-red" style="font-size:12px;margin-bottom:10px">No screenshot submitted</p>`}`;

  const statusBtns = ['Pending','Paid','Confirmed'].map(s=>`<button class="status-btn ${p.status===s?'active-'+s.toLowerCase():''}" onclick="updateStatus('${p.id}','${s}')">${s}</button>`).join('');

  return `
    <div class="entry-card" id="entry-${p.id}">
      <div class="entry-inner">
        ${isEdit?editHtml:infoHtml}
        ${!isEdit?`
        <div class="entry-actions">
          ${statusBtns}
          <button class="btn-sm" onclick="startEdit('${p.id}')">Edit</button>
          <button class="btn-sm btn-del" onclick="deleteEntry('${p.id}')">✕</button>
        </div>`:''}
      </div>
      <div class="screenshot-full" id="ss-${p.id}" style="${isExp?'display:block':'display:none'}">
        ${p.screenshotData?`<img src="${p.screenshotData}" alt="Payment proof">`:''}
      </div>
    </div>`;
}

function renderClasses() {
  const branchOpts = BRANCHES.map(b=>`<option value="${b.name}" ${newClassBranch===b.name?'selected':''}>${b.name}</option>`).join('');
  const branchLists = BRANCHES.map(b=>{
    const items = (classes[b.name]||[]).map((c,i)=>`
      <div class="class-row">
        <span style="font-size:14px;color:rgba(255,240,220,.85)">${escHtml(c)}</span>
        <button class="btn-sm btn-del" onclick="deleteClass('${b.name}',${i})">Delete</button>
      </div>`).join('');
    return `<div style="margin-bottom:18px"><p style="font-size:13px;letter-spacing:.12em;color:#deb060;text-transform:uppercase;margin-bottom:10px">${b.name}</p>${items||'<p style="font-size:13px;color:rgba(255,240,220,.3)">No classes.</p>'}</div>`;
  }).join('');

  return `
    <div class="card">
      <p style="font-size:16px;font-weight:700;margin:0 0 14px;color:#deb060">Add a Class</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <select onchange="newClassBranch=this.value">${branchOpts}</select>
        <input id="newClassInput" placeholder="e.g. Hip Hop – Teacher Name (Sat 4:00–6:00 PM)" value="${escHtml(newClassName)}" oninput="newClassName=this.value" onkeydown="if(event.key==='Enter')addClass()">
        <button class="btn-gold" style="padding:12px;letter-spacing:.08em;font-size:14px" onclick="addClass()">Add Class</button>
      </div>
    </div>
    ${branchLists}`;
}

// ── Event handlers ──────────────────────────────────────────
function handleTitleTap() {
  clearTimeout(tapTimer);
  tapCount++;
  if (tapCount >= 5) { tapCount=0; setMode('adminPin'); }
  else tapTimer = setTimeout(()=>tapCount=0, 1200);
}

function setMode(m) { mode=m; render(); }

function selectPayment(id) { form.paymentMethod=id; render(); }

function selectBranch(b) {
  form.branch=b;
  const list=classes[b]||[];
  form.className=list.length?list[0]:'';
  render();
}

function handleFile(file) {
  if (!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ form.screenshotData=e.target.result; form.screenshotName=file.name; errors.screenshot=null; render(); };
  reader.readAsDataURL(file);
}

function clearScreenshot() { form.screenshotData=null; form.screenshotName=''; render(); }

function validateForm() {
  errors={};
  if (!form.studentName.trim()) errors.studentName='Required';
  if (!form.parentName.trim())  errors.parentName='Required';
  if (!form.className)          errors.className='Required';
  if (!form.contact.trim())     errors.contact='Required';
  if (!form.screenshotData)     errors.screenshot='Please upload your payment screenshot';
  return Object.keys(errors).length===0;
}

async function submitForm() {
  if (!validateForm()) { render(); return; }
  submitting=true; render();
  const entry={
    id: Date.now()+'-'+Math.random().toString(36).slice(2,6),
    studentName:form.studentName, parentName:form.parentName, branch:form.branch,
    className:form.className, contact:form.contact, paymentMethod:form.paymentMethod,
    screenshotData:form.screenshotData, screenshotName:form.screenshotName,
    status:'Pending',
    submittedAt:new Date().toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}),
  };
  // Re-read latest before writing
  const latest=storageGet(STORAGE_KEY)||[];
  const updated=[entry,...latest];
  storageSet(STORAGE_KEY,updated);
  payments=updated;
  submitted={...form};
  submitting=false; done=true; render();
}

function resetForm() {
  form={ studentName:'', parentName:'', branch:'Manila / Binondo', className:(classes['Manila / Binondo']||[''])[0], contact:'', paymentMethod:'gcash', screenshotData:null, screenshotName:'' };
  errors={}; submitted=null; done=false; render();
}

function tryUnlock() {
  const val=document.getElementById('pinInput')?.value||'';
  if (val===ADMIN_PIN) { setMode('admin'); }
  else { const e=document.getElementById('pinErr'); if(e) e.style.display='block'; document.getElementById('pinInput').value=''; }
}

function switchAdminTab(tab) { adminTab=tab; renderAdmin_(); }

function renderAdmin_() {
  const el=document.getElementById('app'); if(!el) return;
  el.innerHTML=renderAdmin(); bindEvents();
}

function getFiltered() {
  const q=search.toLowerCase();
  return payments.filter(p=>{
    const mq=p.studentName?.toLowerCase().includes(q)||p.parentName?.toLowerCase().includes(q)||p.className?.toLowerCase().includes(q)||p.contact?.toLowerCase().includes(q);
    return mq&&(filterStatus==='All'||p.status===filterStatus)&&(filterBranch==='All'||p.branch===filterBranch);
  });
}

function updateStatus(id,status) {
  payments=payments.map(p=>p.id===id?{...p,status}:p);
  storageSet(STORAGE_KEY,payments);
  // just re-render the entries list for speed
  const el=document.getElementById('entries-list');
  if (el) { el.innerHTML=getFiltered().map(renderEntry).join(''); bindEvents(); }
}

function deleteEntry(id) {
  if (!confirm('Delete this registration? This cannot be undone.')) return;
  payments=payments.filter(p=>p.id!==id);
  storageSet(STORAGE_KEY,payments);
  renderAdmin_();
}

function startEdit(id) {
  const p=payments.find(x=>x.id===id);
  if (!p) return;
  editingId=id;
  editForm={studentName:p.studentName,parentName:p.parentName,branch:p.branch,className:p.className,contact:p.contact};
  const el=document.getElementById('entries-list');
  if (el) { el.innerHTML=getFiltered().map(renderEntry).join(''); bindEvents(); }
}

function cancelEdit() { editingId=null; editForm={}; renderAdmin_(); }

function saveEdit(id) {
  payments=payments.map(p=>p.id===id?{...p,...editForm}:p);
  storageSet(STORAGE_KEY,payments);
  editingId=null; editForm={};
  renderAdmin_();
}

function toggleExpand(id) {
  if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
  const ss=document.getElementById('ss-'+id);
  const btn=document.querySelector(`#entry-${id} .screenshot-expand`);
  if (ss) ss.style.display=expandedIds.has(id)?'block':'none';
  if (btn) btn.textContent=expandedIds.has(id)?'▲ Hide Screenshot':'▼ View Payment Screenshot';
}

function addClass() {
  const name=newClassName.trim(); if (!name) return;
  classes[newClassBranch]=[...(classes[newClassBranch]||[]),name];
  storageSet(CLASSES_KEY,classes);
  newClassName='';
  renderAdmin_();
}

function deleteClass(branch,idx) {
  classes[branch]=classes[branch].filter((_,i)=>i!==idx);
  storageSet(CLASSES_KEY,classes);
  renderAdmin_();
}

function buildCSV() {
  const filtered=getFiltered();
  const headers=['Student Name','Parent Name','Branch','Class','Contact','Payment Method','Status','Amount','Submitted At'];
  const rows=filtered.map(p=>[p.studentName,p.parentName,p.branch,p.className,p.contact,p.paymentMethod,p.status,'750',p.submittedAt]);
  const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  return [headers,...rows].map(r=>r.map(esc).join(',')).join('\n');
}

function doExport() {
  const filtered=getFiltered();
  csvText=buildCSV();
  const filename=`SOD_Photoshoot_${new Date().toISOString().slice(0,10)}.csv`;
  // Try direct download
  try {
    const blob=new Blob(['\uFEFF'+csvText],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  } catch(e){}
  // Always show modal as fallback
  document.getElementById('exportCount').textContent=`${filtered.length} record${filtered.length===1?'':'s'} ready`;
  document.getElementById('csvTextarea').value=csvText;
  document.getElementById('exportModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function copyCSV() {
  try {
    await navigator.clipboard.writeText(csvText);
    const btn=document.getElementById('copyBtn');
    btn.textContent='✓ Copied!';
    setTimeout(()=>btn.textContent='Copy to Clipboard',2000);
  } catch {
    const ta=document.getElementById('csvTextarea');
    if (ta) { ta.focus(); ta.select(); }
  }
}

function openCSVTab() {
  const win=window.open('','_blank');
  if (win) {
    win.document.write('<pre style="font-family:monospace;font-size:13px;white-space:pre-wrap">'+csvText.replace(/</g,'&lt;')+'</pre>');
    win.document.title='SOD Photoshoot Export';
  }
}

// drag and drop
function bindEvents() {
  const zone=document.getElementById('uploadZone');
  if (zone) {
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');handleFile(e.dataTransfer.files[0]);});
  }
}

function escHtml(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ───────────────────────────────────────────────────
loadAll();
render();
</script>
</body>
</html>
